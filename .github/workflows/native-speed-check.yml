name: Noqeri isolated native execution benchmark
on:
  push:
    branches: [benchmark/noqeri-native-20261024]
permissions:
  contents: read
jobs:
  native-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build official Noqeri Stage-0 compiler
        run: |
          cmake -S . -B build-speed -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-speed --target noqeri -j 2
      - name: Benchmark Noqeri native AOT against C and Go
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,json,platform,statistics,time,hashlib
          root=pathlib.Path.cwd();out=root/'build-speed'
          original=(root/'Benchmarks/workloads/sorting.noqeri').read_text()
          assert original.count('round < 200 as usize')==1
          modified=original.replace('round < 200 as usize','round < 2000 as usize')
          source=out/'sorting_scaled.noqeri';source.write_text(modified)
          exe=out/'noqeri_sorting'
          def command(argv):
              r=subprocess.run(argv,capture_output=True,text=True,check=True)
              return r.stdout.strip()
          command(['node','scripts/native-build.mjs',str(source),str(exe),'--compiler=build-speed/noqeri','--opt=-O3'])
          provenance=json.loads(pathlib.Path(str(exe)+'.native.json').read_text())
          assert provenance['execution_model']=='native-aot'
          assert provenance['target']=='linux-x86_64-sysv'
          assert provenance['self_hosted_compiler']==False
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==provenance['artifact_sha256']
          csource=r'''
          #include <stdio.h>
          #include <stdint.h>
          int main(){
             int64_t values[256];
             for(int i=0;i<256;i++)values[i]=((i*7919+104729)%65521);
             for(int round=0;round<2000;round++)for(int a=1;a<256;a++){
                 int64_t key=values[a];int b=a;
                 while(b>0&&values[b-1]>key){values[b]=values[b-1];b--;}
                 values[b]=key;
             }
             printf("%lld\n%lld\n",(long long)values[0],(long long)values[255]);
          }
          '''
          gosource=r'''
          package main
          import "fmt"
          func main(){
            var v [256]int64
            for i:=0;i<256;i++{v[i]=int64((i*7919+104729)%65521)}
            for round:=0;round<2000;round++{for a:=1;a<256;a++{
              key:=v[a];b:=a
              for b>0&&v[b-1]>key{v[b]=v[b-1];b--}
              v[b]=key
            }}
            fmt.Printf("%d\n%d\n",v[0],v[255])
          }
          '''
          (out/'ref.c').write_text(csource)
          (out/'ref.go').write_text(gosource)
          command(['gcc','-O3','-std=c11',str(out/'ref.c'),'-o',str(out/'c_sorting')])
          command(['go','build','-o',str(out/'go_sorting'),str(out/'ref.go')])
          cases={'Noqeri native AOT':exe,'C GCC -O3':out/'c_sorting','Go':out/'go_sorting'}
          def run_one(p):
            start=time.perf_counter_ns(); got=command([str(p)]);elapsed=(time.perf_counter_ns()-start)/1e6
            if got!='64\n65032':raise ValueError(f'Incorrect output {p}: {got!r}')
            return elapsed
          result={'revision':command(['git','rev-parse','HEAD']),'cpu':platform.processor(),
            'kernel':platform.release(),'compiler':command([str(out/'noqeri'),'--version']),
            'execution_model':'native-aot','source_scale':'sorting x10 (2000 rounds)','warmups':3,'samples':21,'benchmarks':{},'noqeri_provenance':provenance}
          for name,exe_path in cases.items():
            for i in range(3):run_one(exe_path)
            timings=[run_one(exe_path) for _ in range(21)]
            result['benchmarks'][name]={'median_ms':statistics.median(timings),'p95_ms':sorted(timings)[19],'raw_ms':timings}
            print(f'PERF_RESULT {name}: median_ms={statistics.median(timings):.5f} p95_ms={sorted(timings)[19]:.5f}',flush=True)
          (out/'native-speed-results.json').write_text(json.dumps(result,indent=2)+'\n')
          print('PERF_JSON '+json.dumps(result),flush=True)
          PY
      - name: Measure native scaling at 200, 2000 and 20000 rounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,platform,statistics,subprocess,time
          root=pathlib.Path.cwd();out=root/'build-speed'
          original=(root/'Benchmarks/workloads/sorting.noqeri').read_text()
          c_template=(out/'ref.c').read_text()
          go_template=(out/'ref.go').read_text()
          assert original.count('round < 200 as usize')==1
          assert c_template.count('round<2000')==1
          assert go_template.count('round<2000')==1
          def run(cmd):
            r=subprocess.run(cmd,check=True,capture_output=True,text=True)
            return r.stdout.strip()
          def time_binary(binary):
            samples=[]
            for i in range(-3,21):
              start=time.perf_counter_ns()
              output=run([str(binary)])
              ms=(time.perf_counter_ns()-start)/1e6
              if output!='64\n65032':raise ValueError(f'Incorrect output {binary}: {output!r}')
              if i>=0:samples.append(ms)
            ordered=sorted(samples)
            return {'median_ms':statistics.median(samples),'p95_ms':ordered[19],'raw_ms':samples}
          result={'benchmark':'same sorting input and algorithm, larger round count','revision':run(['git','rev-parse','HEAD']),'execution_model':'native-aot','warmups':3,'samples':21,'workloads':[]}
          for rounds in (200,2000,20000):
            source=out/f'sorting_{rounds}.noqeri'
            source.write_text(original.replace('round < 200 as usize',f'round < {rounds} as usize'))
            native=out/f'sorting_{rounds}_noqeri'
            run(['node','scripts/native-build.mjs',str(source),str(native),'--compiler=build-speed/noqeri','--opt=-O3'])
            prov=json.loads(pathlib.Path(str(native)+'.native.json').read_text())
            if prov.get('execution_model')!='native-aot' or prov.get('self_hosted_compiler')!=False:raise ValueError('invalid AOT provenance')
            if hashlib.sha256(native.read_bytes()).hexdigest()!=prov['artifact_sha256']:raise ValueError('invalid native binary hash')
            c_source=out/f'sorting_{rounds}.c';c_source.write_text(c_template.replace('round<2000',f'round<{rounds}'))
            go_source=out/f'sorting_{rounds}.go';go_source.write_text(go_template.replace('round<2000',f'round<{rounds}'))
            c=out/f'sorting_{rounds}_c';go=out/f'sorting_{rounds}_go'
            run(['gcc','-O3','-std=c11',str(c_source),'-o',str(c)])
            run(['go','build','-o',str(go),str(go_source)])
            readings={name:time_binary(exe) for name,exe in [('noqeri',native),('c',c),('go',go)]}
            result['workloads'].append({'rounds':rounds,'medians_ms':{k:v['median_ms'] for k,v in readings.items()},'full_readings':readings,'noqeri_provenance':prov})
            print('SCALE_RESULT '+json.dumps({'rounds':rounds,'medians_ms':{k:round(v['median_ms'],5) for k,v in readings.items()}}),flush=True)
          (out/'native-speed-scaling.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-noqeri-benchmark-results
          path: |
            build-speed/native-speed-results.json
            build-speed/native-speed-scaling.json
