name: Noqeri native execution retest 2026-10-25
on:
  push:
    branches: [benchmark/noqeri-execution-20261025]
permissions:
  contents: read
jobs:
  native-execution-retake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest Noqeri revision on isolated benchmark branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin 2026-10-24 baseline alongside current working tree
        run: |
          set -euo pipefail
          git worktree add --detach .benchmark-baseline-20261025 3ffec426112705dc36c39fb12e58eb3f3f0d3edd
          test "$(git -C .benchmark-baseline-20261025 rev-parse HEAD)" = 3ffec426112705dc36c39fb12e58eb3f3f0d3edd
      - name: Build both real Noqeri Stage-0 native compilers
        run: |
          set -euo pipefail
          cmake -S .benchmark-baseline-20261025 -B .benchmark-baseline-20261025/build-compare -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build .benchmark-baseline-20261025/build-compare --target noqeri -j 2
          cmake -S . -B build-compare -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-compare --target noqeri -j 2
      - name: Run new real native execution speed and correctness tests
        run: python3 Benchmarks/native-execution-20261025.py
      - name: Upload full raw samples, executable checksums and versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noqeri-native-execution-20261025
          if-no-files-found: warn
          path: |
            build-compare/results/native-execution-results.json
