name: PGAS experimental native tests
on:
  push:
    paths:
      - "Runtime/native/pgas_runtime.cpp"
      - "Runtime/native/pgas_rdma.cpp"
      - "Runtime/native/pgas_replication.cpp"
      - "Include/noqeri/pgas_replication.h"
      - "Include/noqeri/pgas_rdma.h"
      - "Compiler/bootstrap/parser_host.cpp"
      - "Compiler/bootstrap/lexer_host.cpp"
      - "Compiler/type_checker.cpp"
      - "Compiler/nir.cpp"
      - "Include/noqeri/ast.hpp"
      - "Include/noqeri/nir.hpp"
      - "tests/pgas-attribute.test.mjs"
      - "CMakeLists.txt"
      - "Lib/std/pgas.noqeri"
      - "Lib/std/pgas_tls.noqeri"
      - "Lib/std/pgas_rdma.noqeri"
      - "Lib/std/pgas_replication.noqeri"
      - "tests/version-track.test.mjs"
      - "Include/noqeri/version.hpp"
      - "Compiler/selfhost/driver.noqeri"
      - "project.nqon"
      - "Runtime/native/pgas_tls_gateway.cpp"
      - "Include/noqeri/pgas_tls_gateway.h"
      - "tests/scripts/pgas-tls-cert-test.sh"
      - "Include/noqeri/pgas_runtime.h"
      - "tests/cpp/pgas_*"
      - ".github/workflows/pgas-native.yml"
  pull_request:
    paths:
      - "Runtime/native/pgas_runtime.cpp"
      - "Runtime/native/pgas_rdma.cpp"
      - "Include/noqeri/pgas_rdma.h"
      - "Runtime/native/pgas_tls_gateway.cpp"
      - "Include/noqeri/pgas_tls_gateway.h"
      - "Lib/std/pgas.noqeri"
      - "Lib/std/pgas_tls.noqeri"
      - "CMakeLists.txt"
      - "Include/noqeri/pgas_runtime.h"
      - "tests/cpp/pgas_*"
      - ".github/workflows/pgas-native.yml"
jobs:
  pgas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install RDMA user-space headers (no fabric hardware implied)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libibverbs-dev
      - name: Check active 0.1.3 versions
        run: node --test tests/version-track.test.mjs
      - name: Compile with warnings as errors
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude -DNOQERI_HAS_IBVERBS Runtime/native/pgas_rdma.cpp tests/cpp/pgas_rdma_probe_test.cpp -libverbs -o /tmp/pgas_rdma_probe_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude Runtime/native/pgas_runtime.cpp Runtime/native/pgas_tls_gateway.cpp tests/cpp/pgas_cross_host_smoke.cpp -lssl -lcrypto -o /tmp/pgas_cross_host_smoke
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude Runtime/native/pgas_runtime.cpp Runtime/native/pgas_tls_gateway.cpp Runtime/native/pgas_replication.cpp tests/cpp/pgas_replication_test.cpp -lssl -lcrypto -o /tmp/pgas_replication_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude Runtime/native/pgas_runtime.cpp tests/cpp/pgas_runtime_test.cpp -o /tmp/pgas_runtime_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude Runtime/native/pgas_runtime.cpp tests/cpp/pgas_process_test.cpp -o /tmp/pgas_process_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude Runtime/native/pgas_runtime.cpp tests/cpp/pgas_durable_test.cpp -o /tmp/pgas_durable_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -IInclude Runtime/native/pgas_runtime.cpp Runtime/native/pgas_tls_gateway.cpp tests/cpp/pgas_tls_test.cpp -lssl -lcrypto -o /tmp/pgas_tls_test
      - name: Run transport and crash tests
        run: |
          timeout 30s /tmp/pgas_rdma_probe_test
          timeout 30s bash tests/scripts/pgas-tls-cert-test.sh /tmp/pgas_replication_test
          timeout 30s /tmp/pgas_runtime_test
          timeout 30s /tmp/pgas_process_test
          timeout 30s /tmp/pgas_durable_test
          timeout 30s bash tests/scripts/pgas-tls-cert-test.sh /tmp/pgas_tls_test
      - name: CMake integration and Noqeri source check
        run: |
          cmake -S . -B /tmp/noqeri-pgas-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/noqeri-pgas-build --target noqeri noqeri_pgas_runtime noqeri_pgas_tls_gateway noqeri_pgas_rdma noqeri_pgas_replication noqeri-pgas-cross-host-smoke -j 2
          /tmp/noqeri-pgas-build/noqeri check Lib/std/pgas.noqeri
          /tmp/noqeri-pgas-build/noqeri check Lib/std/pgas_tls.noqeri
          /tmp/noqeri-pgas-build/noqeri check Lib/std/pgas_rdma.noqeri
          /tmp/noqeri-pgas-build/noqeri check Lib/std/pgas_replication.noqeri
          NOQERI_PGAS_COMPILER=/tmp/noqeri-pgas-build/noqeri node --test tests/pgas-attribute.test.mjs
