name: Noqeri reactive web views
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test Noqeri view frontend, runtime and web project
        run: node --test tests/web-hydration.test.mjs tests/web-framework.test.mjs tests/web-views.test.mjs tests/web-motion.test.mjs tests/web-project.test.mjs tests/web-compiler.test.mjs
      - name: Measure Noqeri view build parallelism and gate p95 build latency
        env:
          NOQERI_BUILD_BENCH_SAMPLES: '4'
          NOQERI_BUILD_BENCH_ASSETS: '160'
          NOQERI_BUILD_BENCH_P95_MS: '3000'
        run: node tests/web-build-performance.mjs
      - name: Build zero-HTML Noqeri web app
        run: |
          node Runtime/web-project.mjs examples/web_view /tmp/noqeri-web-view
          test -s /tmp/noqeri-web-view/index.html
          test -s /tmp/noqeri-web-view/__noqeri/runtime.mjs
          test -s /tmp/noqeri-web-view/ui/badge.mjs
      - name: Build native Noqeri routed app without handwritten HTML or JS
        run: |
          node Runtime/web-project.mjs examples/native_web /tmp/noqeri-native-web
          test -s /tmp/noqeri-native-web/index.html
          test -s /tmp/noqeri-native-web/about/index.html
          test -s /tmp/noqeri-native-web/noqeri/ui.mjs
          test -s /tmp/noqeri-native-web/__noqeri/theme.css
