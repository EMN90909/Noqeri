name: Portable native scalar C11 AOT

on:
  push:
    branches: [main]
    paths:
      - 'Compiler/portable_c_backend.cpp'
      - 'Compiler/bootstrap/cli_host.cpp'
      - 'Include/noqeri/targets.hpp'
      - 'CMakeLists.txt'
      - 'tests/portable_native_*.noqeri'
      - '.github/workflows/portable-native-c.yml'
      - 'tests/portable-c11-consumer/CMakeLists.txt'
  pull_request:
    paths:
      - 'Compiler/portable_c_backend.cpp'
      - 'Compiler/bootstrap/cli_host.cpp'
      - 'Include/noqeri/targets.hpp'
      - 'CMakeLists.txt'
      - 'tests/portable_native_*.noqeri'
      - '.github/workflows/portable-native-c.yml'
      - 'tests/portable-c11-consumer/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-c11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checked Noqeri compiler
        run: |
          cmake -S . -B build-portable -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNOQERI_WARNINGS_AS_ERRORS=ON
          cmake --build build-portable --target noqeri --parallel 2
      - name: Compare scalar native and reference execution
        shell: bash
        run: |
          set -euo pipefail
          for level in O0 O3; do
            ./build-portable/noqeri emit-c tests/portable_native_scalar.noqeri "build-portable/smoke-$level.c" "-$level"
            cc -std=c11 -O2 -Werror -Wno-unused-function "build-portable/smoke-$level.c" -lm -o "build-portable/smoke-$level"
            expected="$(./build-portable/noqeri run tests/portable_native_scalar.noqeri "-$level")"
            actual="$("build-portable/smoke-$level")"
            test "$actual" = "$expected" || {
              printf 'reference: %s\nnative: %s\n' "$expected" "$actual"
              exit 1
            }
          done
      - name: Reject unsupported aggregate NIR without generating artifacts
        shell: bash
        run: |
          set -euo pipefail
          if ./build-portable/noqeri emit-c tests/portable_native_unsupported.noqeri build-portable/rejected.c; then
            echo "unsupported aggregate was incorrectly emitted"; exit 1
          fi
          test ! -e build-portable/rejected.c
          if ./build-portable/noqeri emit-c tests/portable_native_unsupported_text.noqeri build-portable/rejected_text.c; then
            echo "unsupported text arithmetic was incorrectly emitted"; exit 1
          fi
          test ! -e build-portable/rejected_text.c
      - name: Trap invalid float conversion on the C11 native path
        shell: bash
        run: |
          set -euo pipefail
          if ./build-portable/noqeri run tests/portable_native_invalid_cast.noqeri -O0 >/dev/null 2>&1; then
            echo "Stage-0 accepted invalid float cast"; exit 1
          fi
          ./build-portable/noqeri emit-c tests/portable_native_invalid_cast.noqeri build-portable/invalid-cast.c -O0
          cc -std=c11 -O2 -Wno-unused-function build-portable/invalid-cast.c -lm -o build-portable/invalid-cast
          if (ulimit -c 0; build-portable/invalid-cast >/dev/null 2>&1); then
            echo "native C11 failed to trap invalid float cast"; exit 1
          fi

  portable-c11-cross-platform:
    name: Compiled native scalar C11 on alternative host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Compile Noqeri host frontend
        shell: bash
        run: |
          cmake -S . -B build-portable -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-portable --target noqeri --config Release --parallel 2
      - name: Compile and run generated C11 on Unix ARM64 or x64
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for level in O0 O3; do
            ./build-portable/noqeri emit-c tests/portable_native_scalar.noqeri "build-portable/smoke-$level.c" "-$level"
            cmake -S tests/portable-c11-consumer -B "build-portable/consumer-$level"               -DNOQERI_GENERATED_SOURCE="$PWD/build-portable/smoke-$level.c"
            cmake --build "build-portable/consumer-$level" --config Release
            expected="$(./build-portable/noqeri run tests/portable_native_scalar.noqeri "-$level")"
            actual="$("build-portable/consumer-$level/noqeri_generated")"
            test "$expected" = "$actual"
          done
      - name: Compile and run generated C11 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = ".\build-portable\Release\noqeri.exe"
          if (!(Test-Path $compiler)) { throw "Windows Noqeri compiler missing" }
          foreach ($level in @("O0","O3")) {
            & $compiler emit-c tests/portable_native_scalar.noqeri "build-portable/smoke-$level.c" "-$level"
            if ($LASTEXITCODE -ne 0) { throw "emit-c failed" }
            $source = (Resolve-Path "build-portable/smoke-$level.c").Path.Replace('\', '/')
            cmake -S tests/portable-c11-consumer -B "build-portable/consumer-$level" "-DNOQERI_GENERATED_SOURCE=$source"
            if ($LASTEXITCODE -ne 0) { throw "C11 consumer configuration failed" }
            cmake --build "build-portable/consumer-$level" --config Release
            if ($LASTEXITCODE -ne 0) { throw "C11 consumer compilation failed" }
            $expected = ((& $compiler run tests/portable_native_scalar.noqeri "-$level") | Out-String).TrimEnd()
            if ($LASTEXITCODE -ne 0) { throw "reference execution failed" }
            $native = ".\build-portable\consumer-$level\Release\noqeri_generated.exe"
            if (!(Test-Path $native)) { throw "native consumer binary missing" }
            $actual = ((& $native) | Out-String).TrimEnd()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "native/reference output mismatch" }
          }
