name: Registry v1 package client
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NQPKG tar/hash/path validation
        run: node --test tests/registry-client.test.mjs
      - name: Preserve explicitly invoked legacy GitHub fixture mode
        run: node tests/package_manager_host.mjs
