name: Noqeri Stage-2 repeat and everyday numeric helpers
on:
  push:
    branches: [main]
    paths:
      - 'Compiler/bootstrap/parser_host.cpp'
      - 'Include/noqeri/compiler.hpp'
      - 'Compiler/bootstrap/interpreter_host.cpp'
      - 'Compiler/selfhost/ast.noqeri'
      - 'Compiler/selfhost/parser_stmt.noqeri'
      - 'Compiler/selfhost/semantic_program.noqeri'
      - 'Compiler/selfhost/lower.noqeri'
      - 'Lib/std/numeric.noqeri'
      - 'Lib/std/file.noqeri'
      - 'tests/stage2_repeat_parity.noqeri'
      - 'tests/check_stage2_repeat.py'
      - 'examples/simplicity/**'
      - '.github/workflows/stage2-simplicity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Compiler/bootstrap/parser_host.cpp'
      - 'Compiler/selfhost/**'
      - 'Lib/std/numeric.noqeri'
      - 'tests/stage2_repeat_parity.noqeri'
      - 'tests/check_stage2_repeat.py'
      - 'examples/simplicity/**'
      - '.github/workflows/stage2-simplicity.yml'
permissions:
  contents: read
jobs:
  stage2-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ bootstrap compiler
        run: cmake -S . -B build-simplicity -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF -DNOQERI_WEB_SQL_DRIVERS=OFF
      - name: Build actual Stage-0 compiler
        run: cmake --build build-simplicity --target noqeri --parallel 2
      - name: Check self-hosted compiler source with Stage-0
        run: ./build-simplicity/noqeri check Compiler/selfhost/main.noqeri --unsafe
      - name: Typecheck Stage-2 parser and lowering test harness
        run: python3 tests/check_stage2_repeat.py ./build-simplicity/noqeri tests/stage2_repeat_parity.noqeri
      - name: Run practical numeric aggregation and filtering example
        run: |
          set -euo pipefail
          ./build-simplicity/noqeri check examples/simplicity/students.noqeri --unsafe
          ./build-simplicity/noqeri run examples/simplicity/students.noqeri --unsafe | grep -Fx NUMERIC_SIMPLICITY_PASS
      - name: Check and run typed expression-bodied functions
        run: |
          set -euo pipefail
          ./build-simplicity/noqeri check examples/simplicity/short_functions.noqeri
          ./build-simplicity/noqeri run examples/simplicity/short_functions.noqeri | grep -Fx SHORT_FUNCTIONS_PASS
      - name: Collection iteration and negative syntax tests
        run: |
          set -euo pipefail
          ./build-simplicity/noqeri check examples/simplicity/for_collections.noqeri
          ./build-simplicity/noqeri run examples/simplicity/for_collections.noqeri | grep -Fx FOR_SLICE_PASS
          if ./build-simplicity/noqeri check tests/invalid_for_keyword.noqeri; then exit 1; fi
      - name: Check bounded file convenience APIs
        run: ./build-simplicity/noqeri check examples/simplicity/bounded_files.noqeri
      - name: Boolean equality runtime regression
        run: |
          set -euo pipefail
          ./build-simplicity/noqeri run tests/bool_equality.noqeri | grep -Fx BOOL_EQUALITY_PASS
      - name: Check original repeat syntax compatibility
        run: ./build-simplicity/noqeri check tests/repeat_loop.noqeri
