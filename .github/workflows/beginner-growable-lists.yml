name: Beginner growable scalar lists native and NQRI qualification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Compiler/selfhost/**'
      - 'Compiler/type_checker.cpp'
      - 'Compiler/lifetime.cpp'
      - 'Compiler/nir.cpp'
      - 'Compiler/core.cpp'
      - 'Compiler/bootstrap/interpreter_host.cpp'
      - 'Include/noqeri/**'
      - 'Runtime/native/owned_collections.cpp'
      - 'Runtime/native/nqri_vm_part3.inc'
      - 'scripts/native-build.mjs'
      - 'tests/beginner_growable_*.noqeri'
      - '.github/workflows/beginner-growable-lists.yml'
permissions:
  contents: read
jobs:
  local-owned-lists:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete checked compiler and NQRI VM
        run: |
          set -euo pipefail
          cmake -S . -B build-beginner-list -DCMAKE_BUILD_TYPE=Release -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_WEB_SQL_DRIVERS=OFF
          cmake --build build-beginner-list --target noqeri noqeri-nqri --parallel 2
      - name: Original beginner syntax executes without list APIs or imports
        run: |
          set -euo pipefail
          ./build-beginner-list/noqeri check tests/beginner_growable_lists.noqeri
          ./build-beginner-list/noqeri nir tests/beginner_growable_lists.noqeri
          echo "Reference O0:"
          ./build-beginner-list/noqeri run tests/beginner_growable_lists.noqeri -O0
          actual=$(./build-beginner-list/noqeri run tests/beginner_growable_lists.noqeri)
          echo "Reference runtime: $actual"
          test "$actual" = "$(printf '3\n0')"
      - name: C++ compiler emits and NQRI executes an owned growable List
        run: |
          set -euo pipefail
          ./build-beginner-list/noqeri nqri tests/beginner_growable_lists.noqeri build-beginner-list/lists.nqri
          output=$(./build-beginner-list/noqeri-nqri build-beginner-list/lists.nqri __entry)
          echo "NQRI: $output"
          # The standalone NQRI CLI also prints the invoked entry's
          # integer return value (0), unlike the Stage-0 run command.
          test "$output" = "$(printf '3\n0\n0')"

      - name: Native Linux AOT auto links owned storage with no special flags
        run: |
          set -euo pipefail
          node scripts/native-build.mjs tests/beginner_growable_lists.noqeri build-beginner-list/lists-native --compiler=build-beginner-list/noqeri
          output=$(./build-beginner-list/lists-native)
          echo "Native AOT: $output"
          test "$output" = "$(printf '3\n0')"
      - name: Self-hosted Stage-2 compiler accepts and executes beginner list source
        run: |
          set -euo pipefail
          sha256sum -c Compiler/selfhost/trusted-stage1.sha256
          ./build-beginner-list/noqeri-nqri compile-manifest Compiler/selfhost/trusted-stage1.nqri "$PWD" "$PWD/Compiler/selfhost/stage2-sources.txt" build-beginner-list/selfhost-stage2.nqri 3
          echo 'Stage-2 smoke compile with stdout trace enabled:'
          ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri tests/beginner_growable_stage2_smoke.noqeri build-beginner-list/selfhost-smoke.nqri 3
          smoke=$(./build-beginner-list/noqeri-nqri build-beginner-list/selfhost-smoke.nqri verify)
          echo "Minimal Stage-2 append: $smoke"
          test "$smoke" = "0"
          ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri tests/beginner_growable_lists.noqeri build-beginner-list/selfhost-lists.nqri 3
          result=$(./build-beginner-list/noqeri-nqri build-beginner-list/selfhost-lists.nqri verify)
          echo "Self-hosted Stage-2 list verification: $result"
          test "$result" = "0"
      - name: Reject mismatched, fixed and aliased mutable collections
        run: |
          set -euo pipefail
          for path in tests/beginner_growable_bad_type.noqeri tests/beginner_growable_bad_mixed_float.noqeri tests/beginner_growable_fixed_array.noqeri tests/beginner_growable_bad_alias.noqeri tests/beginner_growable_bad_return.noqeri tests/beginner_growable_bad_reassign.noqeri tests/beginner_growable_bad_index_assignment.noqeri tests/beginner_growable_bad_index_borrow.noqeri; do
            if ./build-beginner-list/noqeri check "$path"; then
              echo "unexpectedly accepted $path"; exit 1
            fi
          done

      - name: Self-hosted Stage-2 rejects invalid owned list operations
        run: |
          set -euo pipefail
          for path in tests/beginner_growable_bad_type.noqeri tests/beginner_growable_bad_mixed_float.noqeri tests/beginner_growable_fixed_array.noqeri tests/beginner_growable_bad_alias.noqeri tests/beginner_growable_bad_return.noqeri tests/beginner_growable_bad_reassign.noqeri; do
            if ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri "$path" build-beginner-list/invalid-list.nqri 3; then
              echo "Stage-2 unexpectedly accepted $path"; exit 1
            fi
          done
      - name: Float and bool list semantics match the compiler and execution engines
        run: |
          set -euo pipefail
          src=tests/beginner_growable_scalar_lists.noqeri
          ./build-beginner-list/noqeri check "$src"
          test "$(./build-beginner-list/noqeri run "$src")" = "0"
          ./build-beginner-list/noqeri nqri "$src" build-beginner-list/scalar-lists.nqri
          test "$(./build-beginner-list/noqeri-nqri build-beginner-list/scalar-lists.nqri verify)" = "0"
          test "$(node Runtime/nqri-vm.mjs build-beginner-list/scalar-lists.nqri verify)" = "0"
          ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri "$src" build-beginner-list/stage2-scalar-lists.nqri 3
          test "$(./build-beginner-list/noqeri-nqri build-beginner-list/stage2-scalar-lists.nqri verify)" = "0"
          node scripts/native-build.mjs "$src" build-beginner-list/scalar-lists-native --compiler=build-beginner-list/noqeri
          test "$(./build-beginner-list/scalar-lists-native)" = "0"

      - name: Nested append and typed empty list inference agrees across backends
        run: |
          set -euo pipefail
          src=tests/beginner_growable_lexical_inference.noqeri
          ./build-beginner-list/noqeri check "$src"
          test "$(./build-beginner-list/noqeri run "$src")" = "0"
          ./build-beginner-list/noqeri nqri "$src" build-beginner-list/lexical-lists.nqri
          test "$(./build-beginner-list/noqeri-nqri build-beginner-list/lexical-lists.nqri verify)" = "0"
          test "$(node Runtime/nqri-vm.mjs build-beginner-list/lexical-lists.nqri verify)" = "0"
          ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri "$src" build-beginner-list/stage2-lexical-lists.nqri 3
          test "$(./build-beginner-list/noqeri-nqri build-beginner-list/stage2-lexical-lists.nqri verify)" = "0"
          node scripts/native-build.mjs "$src" build-beginner-list/lexical-lists-native --compiler=build-beginner-list/noqeri
          test "$(./build-beginner-list/lexical-lists-native)" = "0"

      - name: Reject incompatible element types after nested empty-list inference
        run: |
          set -euo pipefail
          src=tests/beginner_growable_bad_empty_inference.noqeri
          if ./build-beginner-list/noqeri check "$src"; then
            echo "Stage-0 accepted conflicting list element types"; exit 1
          fi
          if ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri "$src" build-beginner-list/invalid-inferred-list.nqri 3; then
            echo "Stage-2 accepted conflicting list element types"; exit 1
          fi

      - name: Owned list cleanup executes before integer-status early propagation
        run: |
          set -euo pipefail
          ./build-beginner-list/noqeri check tests/beginner_growable_try_cleanup.noqeri
          test "$(./build-beginner-list/noqeri run tests/beginner_growable_try_cleanup.noqeri)" = "0"
          ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri tests/beginner_growable_try_cleanup.noqeri build-beginner-list/try-cleanup.nqri 3
          test "$(./build-beginner-list/noqeri-nqri build-beginner-list/try-cleanup.nqri verify)" = "0"
          node scripts/native-build.mjs tests/beginner_growable_try_cleanup.noqeri build-beginner-list/try-cleanup-native --compiler=build-beginner-list/noqeri
          test "$(./build-beginner-list/try-cleanup-native)" = "0"

      - name: Empty pop rejects at runtime in reference, NQRI and native AOT
        run: |
          set -euo pipefail
          ./build-beginner-list/noqeri check tests/beginner_growable_empty_pop.noqeri
          if ./build-beginner-list/noqeri run tests/beginner_growable_empty_pop.noqeri; then echo "reference silently popped empty list"; exit 1; fi
          ./build-beginner-list/noqeri nqri tests/beginner_growable_empty_pop.noqeri build-beginner-list/empty-pop.nqri
          if ./build-beginner-list/noqeri-nqri build-beginner-list/empty-pop.nqri verify; then echo "NQRI silently popped empty list"; exit 1; fi
          node scripts/native-build.mjs tests/beginner_growable_empty_pop.noqeri build-beginner-list/empty-pop-native --compiler=build-beginner-list/noqeri
          ulimit -c 0
          if ./build-beginner-list/empty-pop-native; then echo "native silently popped empty list"; exit 1; fi

      - name: Out-of-range indexed assignment fails closed in all runtimes
        run: |
          set -euo pipefail
          ./build-beginner-list/noqeri check tests/beginner_growable_bad_index_set_range.noqeri
          if ./build-beginner-list/noqeri run tests/beginner_growable_bad_index_set_range.noqeri; then echo "reference accepted bad list assignment"; exit 1; fi
          ./build-beginner-list/noqeri nqri tests/beginner_growable_bad_index_set_range.noqeri build-beginner-list/bad-set.nqri
          if ./build-beginner-list/noqeri-nqri build-beginner-list/bad-set.nqri verify; then echo "NQRI accepted bad list assignment"; exit 1; fi
          ./build-beginner-list/noqeri-nqri compile build-beginner-list/selfhost-stage2.nqri tests/beginner_growable_bad_index_set_range.noqeri build-beginner-list/bad-set-stage2.nqri 3
          if ./build-beginner-list/noqeri-nqri build-beginner-list/bad-set-stage2.nqri verify; then echo "Stage-2 accepted bad list assignment"; exit 1; fi
          node scripts/native-build.mjs tests/beginner_growable_bad_index_set_range.noqeri build-beginner-list/bad-set-native --compiler=build-beginner-list/noqeri
          ulimit -c 0
          if ./build-beginner-list/bad-set-native; then echo "native accepted bad list assignment"; exit 1; fi

      - name: Out-of-range growable index rejects at runtime in all three engines
        run: |
          set -euo pipefail
          ./build-beginner-list/noqeri check tests/beginner_growable_out_of_bounds.noqeri
          if ./build-beginner-list/noqeri run tests/beginner_growable_out_of_bounds.noqeri; then
            echo "Reference silently accepted an out-of-bounds list read"; exit 1
          fi
          ./build-beginner-list/noqeri nqri tests/beginner_growable_out_of_bounds.noqeri build-beginner-list/bad-index.nqri
          if ./build-beginner-list/noqeri-nqri build-beginner-list/bad-index.nqri verify; then
            echo "NQRI silently accepted an out-of-bounds list read"; exit 1
          fi
          node scripts/native-build.mjs tests/beginner_growable_out_of_bounds.noqeri build-beginner-list/bad-index-native --compiler=build-beginner-list/noqeri
          ulimit -c 0
          if ./build-beginner-list/bad-index-native; then
            echo "Native AOT silently accepted an out-of-bounds list read"; exit 1
          fi
