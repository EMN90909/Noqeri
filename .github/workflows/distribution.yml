name: Noqeri cross-platform distributions

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a prerelease after all OS/CPU builds pass"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Pushes of workflow changes can launch a single qualified prerelease.
    # GitHub does not apply paths filters to tag pushes.
    paths:
      - '.github/workflows/distribution.yml'
      - 'cmake/**'
      - 'scripts/distribution/**'
      - 'scripts/distribution.py'
      - 'AndroidApp/**'
      - 'CMakeLists.txt'
      - 'tests/scripts/distribution_package_test.sh'
      - 'tests/scripts/repackage_archive_test.py'

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x86_64}
          - {runner: ubuntu-24.04, target: linux-x86}
          - {runner: ubuntu-24.04-arm, target: linux-aarch64}
          - {runner: windows-2022, target: windows-x86_64}
          - {runner: windows-2022, target: windows-x86}
          - {runner: windows-11-vs2026-arm, target: windows-aarch64}
          - {runner: macos-15-intel, target: macos-x86_64}
          - {runner: macos-15, target: macos-aarch64}
    env:
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging and 32-bit toolchains
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev file
          if [[ "$RELEASE_TARGET" == "linux-x86" ]]; then
            sudo apt-get install -y g++-multilib gcc-multilib libc6-dev-i386
          fi
      - name: Configure portable toolchain (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Bash 3.2 on macOS treats an empty array expansion under set -u
          # as unbound. Keep the array nonempty for every host.
          cmake_args=(
            -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON
            -DNOQERI_ENABLE_SDL2=OFF
            -DBUILD_TESTING=ON
            -DCMAKE_BUILD_TYPE=Release
            "-DNOQERI_PACKAGE_TARGET=$RELEASE_TARGET"
          )
          if [[ "$RELEASE_TARGET" == "linux-x86" ]]; then
            cmake_args+=("-DCMAKE_CXX_FLAGS=-m32" "-DCMAKE_EXE_LINKER_FLAGS=-m32" "-DCMAKE_SHARED_LINKER_FLAGS=-m32")
          fi
          cmake -S . -B build "${cmake_args[@]}"
      - name: Configure portable toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = 'x64'
          $generator = 'Visual Studio 17 2022'
          if ($env:RELEASE_TARGET -eq 'windows-x86') { $architecture = 'Win32' }
          if ($env:RELEASE_TARGET -eq 'windows-aarch64') {
            $architecture = 'ARM64'
            $generator = 'Visual Studio 18 2026'
          }
          cmake -S . -B build -G $generator -A $architecture `
            -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF `
            -DBUILD_TESTING=ON "-DNOQERI_PACKAGE_TARGET=$env:RELEASE_TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build toolchain and portability test
        run: cmake --build build --config Release --target noqeri noqeri-nqri noqeri_graphics_fastpath noqeri-graphics-portability-test --parallel 2
      - name: Portable graphics and shader tests
        run: ctest --test-dir build -C Release --output-on-failure -R '^noqeri-graphics-'
      - name: Install SDK
        run: cmake --install build --config Release --prefix stage
      - name: Validate installed SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./stage/bin/noqeri --version
          ./stage/bin/noqeri check examples/hello.noqeri
          ./stage/bin/noqeri-nqri --selftest
          test -s stage/share/noqeri/Lib/std/render2d.noqeri
          test -d stage/include/noqeri
          case "$RELEASE_TARGET" in
            linux-x86) file stage/bin/noqeri | grep -F 'ELF 32-bit' ;;
            linux-x86_64|linux-aarch64) file stage/bin/noqeri | grep -F 'ELF 64-bit' ;;
            macos-*) file stage/bin/noqeri | grep -F 'Mach-O 64-bit' ;;
          esac
      - name: Validate installed SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./stage/bin/noqeri.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./stage/bin/noqeri.exe check examples/hello.noqeri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./stage/bin/noqeri-nqri.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path stage/share/noqeri/Lib/std/render2d.noqeri)) { throw "Standard library missing" }
          if (!(Test-Path stage/include/noqeri)) { throw "Public headers missing" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'stage/bin/noqeri.exe'))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = switch ($env:RELEASE_TARGET) {
            'windows-x86' { 0x14c }
            'windows-x86_64' { 0x8664 }
            'windows-aarch64' { 0xaa64 }
          }
          if ($machine -ne $expected) { throw "Incorrect Windows PE machine type: $machine (expected $expected)" }
      - name: Export portable archives and native executables
        shell: bash
        run: bash scripts/distribution/archive-sdk.sh
      - name: Generate Linux DEB / RPM installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G DEB -B artifacts
          cpack --config build/CPackConfig.cmake -G RPM -B artifacts
          for pkg in artifacts/*.deb; do dpkg-deb --info "$pkg"; done
          for pkg in artifacts/*.rpm; do rpm -qpi "$pkg"; done
          rm -rf artifacts/_CPack_Packages
      - name: Generate macOS native PKG installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G productbuild -B artifacts
          for pkg in artifacts/*.pkg; do
            pkgutil --expand "$pkg" package-expanded
            test -f package-expanded/Distribution
            rm -rf package-expanded
          done
          rm -rf artifacts/_CPack_Packages
      - name: Generate Windows native NSIS setup and MSI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(noqeri VERSION ([0-9.]+)')
          if (!$match.Success) { throw 'Noqeri project version not found' }
          $base = "noqeri-$($match.Groups[1].Value)-$($env:RELEASE_TARGET)"
          cpack --config build/CPackConfig.cmake -G NSIS -B artifacts -D "CPACK_PACKAGE_FILE_NAME=$base-setup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "artifacts/$base-setup.exe")) { throw 'NSIS setup installer missing' }
          if ($env:RELEASE_TARGET -ne 'windows-aarch64') {
            cpack --config build/CPackConfig.cmake -G WIX -B artifacts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path "artifacts/$base.msi")) { throw 'MSI installer missing' }
          }
          if (Test-Path 'artifacts/_CPack_Packages') {
            Remove-Item -Recurse -Force 'artifacts/_CPack_Packages'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Android NDK / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, target: android-aarch64, elf_machine: AArch64}
          - {abi: armeabi-v7a, target: android-armv7, elf_machine: ARM}
          - {abi: x86_64, target: android-x86_64, elf_machine: X86-64}
          - {abi: x86, target: android-x86, elf_machine: Intel 80386}
    env:
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      ANDROID_ABI: ${{ matrix.abi }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android NDK
        shell: bash
        run: sdkmanager --install "ndk;${NDK_VERSION}"
      - name: Configure Android CLI toolchain (API 24+)
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -f "${ndk}/build/cmake/android.toolchain.cmake"
          cmake -S . -B build-android -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=${ndk}/build/cmake/android.toolchain.cmake" \
            "-DANDROID_ABI=${ANDROID_ABI}" -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF \
            "-DNOQERI_PACKAGE_TARGET=$RELEASE_TARGET" -DBUILD_TESTING=OFF
      - name: Cross-compile Android SDK
        run: cmake --build build-android --target noqeri noqeri-nqri noqeri_graphics_fastpath --parallel 2
      - name: Install Android SDK
        run: cmake --install build-android --prefix stage
      - name: Verify Android binaries and SDK files
        shell: bash
        run: |
          set -euo pipefail
          readelf -h stage/bin/noqeri | grep -F "${ELF_MACHINE}"
          readelf -h stage/bin/noqeri-nqri | grep -F "${ELF_MACHINE}"
          case "$ANDROID_ABI" in
            arm64-v8a|x86_64) bits=ELF64; loader='/system/bin/linker64]' ;;
            armeabi-v7a|x86) bits=ELF32; loader='/system/bin/linker]' ;;
            *) exit 2 ;;
          esac
          readelf -h stage/bin/noqeri | grep -E "Class:.*$bits"
          readelf -h stage/bin/noqeri-nqri | grep -E "Class:.*$bits"
          readelf -l stage/bin/noqeri | grep -F "$loader"
          test -s stage/share/noqeri/Lib/std/render2d.noqeri
          test -d stage/include/noqeri
          # Cross-built Android executables are not runnable on the Linux host.
          # Device/emulator execution remains a separate qualification gate.
      - name: Export native Android SDK binaries and archive
        shell: bash
        run: bash scripts/distribution/archive-sdk.sh
      - name: Build installable Termux DEB
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(noqeri VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          bash scripts/distribution/termux-deb.sh stage artifacts "$RELEASE_TARGET" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  android-app:
    name: Android APK / 32+64-bit universal app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android SDK / CMake / NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compile debug-signed installable Noqeri APK
        shell: bash
        run: gradle -p AndroidApp :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and native ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          apk=AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$apk" | grep -F "lib/$abi/libnoqeri_android.so"
            native="$(mktemp)"
            unzip -p "$apk" "lib/$abi/libnoqeri_android.so" > "$native"
            case "$abi" in
              armeabi-v7a) bits=ELF32; machine=ARM ;;
              arm64-v8a) bits=ELF64; machine=AArch64 ;;
              x86) bits=ELF32; machine='Intel 80386' ;;
              x86_64) bits=ELF64; machine=X86-64 ;;
            esac
            readelf -h "$native" | grep -E "Class:.*$bits"
            readelf -h "$native" | grep -F "$machine"
            rm -f "$native"
          done
          version=$(sed -nE 's/^project\(noqeri VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          grep -F "versionName '$version'" AndroidApp/app/build.gradle
          mkdir -p artifacts
          cp "$apk" "artifacts/noqeri-$version-android-universal-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-android-apk
          path: artifacts/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD VM / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, target: freebsd-x86_64}
          - {arch: aarch64, target: freebsd-aarch64}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          usesh: true
          arch: ${{ matrix.arch }}
          envs: RELEASE_TARGET
          prepare: |
            pkg install -y cmake bash
          run: |
            set -eu
            cmake -S . -B build-freebsd -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release "-DNOQERI_PACKAGE_TARGET=$RELEASE_TARGET"
            cmake --build build-freebsd --target noqeri noqeri-nqri noqeri_graphics_fastpath --parallel 2
            cmake --install build-freebsd --prefix stage
            ./stage/bin/noqeri --version
            ./stage/bin/noqeri check examples/hello.noqeri
            ./stage/bin/noqeri-nqri --selftest
            test -s stage/share/noqeri/Lib/std/render2d.noqeri
            test -d stage/include/noqeri
            bash scripts/distribution/archive-sdk.sh
            cpack --config build-freebsd/CPackConfig.cmake -G FREEBSD -B artifacts
            for pkgfile in artifacts/*.pkg; do pkg info -F "$pkgfile"; done
            rm -rf artifacts/_CPack_Packages build-freebsd stage
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  openbsd:
    name: OpenBSD VM / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, target: openbsd-x86_64}
          - {arch: aarch64, target: openbsd-aarch64}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and package in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          usesh: true
          arch: ${{ matrix.arch }}
          envs: RELEASE_TARGET
          prepare: |
            pkg_add -I cmake bash
          run: |
            set -eu
            cmake -S . -B build-openbsd -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release "-DNOQERI_PACKAGE_TARGET=$RELEASE_TARGET"
            cmake --build build-openbsd --target noqeri noqeri-nqri noqeri_graphics_fastpath --parallel 2
            cmake --install build-openbsd --prefix stage
            ./stage/bin/noqeri --version
            ./stage/bin/noqeri check examples/hello.noqeri
            ./stage/bin/noqeri-nqri --selftest
            test -s stage/share/noqeri/Lib/std/render2d.noqeri
            test -d stage/include/noqeri
            bash scripts/distribution/archive-sdk.sh
            version=$(sed -nE 's/^project\(noqeri VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
            test -n "$version"
            sh scripts/distribution/openbsd-package.sh stage artifacts "$RELEASE_TARGET" "$version"
            rm -rf build-openbsd stage
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  packaging-tests:
    name: Installer and binary packaging unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test artifact creation, SDK archives and CPack DEB metadata
        shell: bash
        run: bash tests/scripts/distribution_package_test.sh
      - name: Test strict release-archive extraction
        shell: bash
        run: python3 -m unittest discover -s tests/scripts -p repackage_archive_test.py -v

  publish:
    name: Publish OS installers, binaries, APK and checksums
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [native, android, android-app, freebsd, openbsd, packaging-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify source version, release coverage and artifact integrity
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(noqeri VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME mismatches compiler version v$version" >&2
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          else
            # Automatic and explicitly dispatched releases are prereleases.
            # Do not hijack a pre-existing stable version tag.
            release_tag="v$version-platform-preview.1"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Never silently replace another commit's release tag.
          existing_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to replace existing release $release_tag at a different commit: $existing_tag_sha" >&2
            exit 1
          fi
          cd artifacts
          require() {
            if [[ ! -s "$1" ]]; then echo "Missing or empty release file: $1" >&2; exit 1; fi
          }
          for target in linux-x86 linux-x86_64 linux-aarch64 \
                        windows-x86 windows-x86_64 windows-aarch64 \
                        macos-x86_64 macos-aarch64 \
                        android-armv7 android-aarch64 android-x86 android-x86_64 \
                        freebsd-x86_64 freebsd-aarch64 \
                        openbsd-x86_64 openbsd-aarch64; do
            case "$target" in
              windows-*)
                require "noqeri-v$version-$target.zip"
                require "noqeri-v$version-$target.exe"
                require "noqeri-nqri-v$version-$target.exe"
                require "noqeri-$version-$target-setup.exe"
                case "$target" in
                  windows-x86|windows-x86_64) require "noqeri-$version-$target.msi" ;;
                esac
                ;;
              *)
                require "noqeri-v$version-$target.tar.gz"
                require "noqeri-v$version-$target.bin"
                require "noqeri-nqri-v$version-$target.bin"
                ;;
            esac
            case "$target" in
              linux-*) require "noqeri-$version-$target.deb"; require "noqeri-$version-$target.rpm" ;;
              macos-*) require "noqeri-$version-$target.pkg" ;;
              android-*) require "noqeri-$version-$target-termux.deb" ;;
              freebsd-*) require "noqeri-$version-$target.pkg" ;;
              openbsd-*) require "noqeri-$version-$target.pkg.tgz" ;;
            esac
          done
          require "noqeri-$version-android-universal-debug.apk"
          sha256sum noqeri-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Repackage all real SDKs as verified binary, gz, tar, tar.gz and zip
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(noqeri VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          # Every one of the 16 native/NDK/VM build jobs must already have
          # succeeded. The repacker refuses missing, symlinked or unsafe SDKs.
          python3 scripts/distribution/repackage_release.py \
            --input artifacts --output dist --version "$version" \
            --source-commit "$GITHUB_SHA" --license LICENSE --include-installers
          python3 scripts/distribution.py combine --input dist \
            --version "$version" --source-commit "$GITHUB_SHA" \
            --require linux-x86,linux-x86_64,linux-arm64,windows-x86,windows-x86_64,windows-arm64,macos-x86_64,macos-arm64,android-armv7,android-arm64,android-x86,android-x86_64,freebsd-x86_64,freebsd-arm64,openbsd-x86_64,openbsd-arm64
          # The standardized formats become real release assets; release
          # manifest paths remain stable inside dist, URLs use flat filenames.
          cp dist/release-manifest.json artifacts/release-manifest.json
          while IFS= read -r -d '' file; do
            cp -f "$file" "artifacts/$(basename "$file")"
          done < <(find dist -mindepth 2 -maxdepth 2 -type f ! -name fragment.json -print0)
          (cd artifacts && sha256sum noqeri-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp artifacts/SHA256SUMS artifacts/checksums.txt
      - name: Publish verified prerelease assets to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Noqeri ${{ steps.verify.outputs.tag }} (platform preview)
          body: |
            Experimental Stage-0 compiler and NQRI runtime downloads.
            Includes x86/ARM64 Linux, Windows, macOS, FreeBSD and OpenBSD;
            four Android CLI ABIs, a debug-signed Android APK, installers,
            standalone host binaries, portable SDK archives and SHA256SUMS.
            Match your operating system AND CPU architecture when downloading.
            These are unsigned preview installers, not production-qualified.
            Android APK is debug signed; device testing and GPU driver
            qualification remain outstanding. Noqeri native code generation
            is not automatically 32-bit or cross-OS just because its compiler
            runs on additional host architectures.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: artifacts/*
          generate_release_notes: true
      - name: Confirm the release exposes every downloadable file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > published-assets.txt
          count=0
          for file in artifacts/*; do
            test -f "$file"
            grep -Fxq "$(basename "$file")" published-assets.txt || {
              echo "GitHub Release is missing $(basename "$file")" >&2
              exit 1
            }
            count=$((count + 1))
          done
          if (( count < 16 )); then echo "Unexpectedly few files on Release" >&2; exit 1; fi
          echo "Confirmed $count downloadable assets on $RELEASE_TAG"
