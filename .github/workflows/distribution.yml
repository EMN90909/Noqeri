name: Noqeri cross-platform distributions

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x86_64}
          - {runner: ubuntu-24.04, target: linux-x86}
          - {runner: ubuntu-24.04-arm, target: linux-aarch64}
          - {runner: windows-2022, target: windows-x86_64}
          - {runner: windows-2022, target: windows-x86}
          - {runner: windows-11-vs2026-arm, target: windows-aarch64}
          - {runner: macos-15-intel, target: macos-x86_64}
          - {runner: macos-15, target: macos-aarch64}
    env:
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging and 32-bit toolchains
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev file
          if [[ "$RELEASE_TARGET" == "linux-x86" ]]; then
            sudo apt-get install -y g++-multilib gcc-multilib libc6-dev-i386
          fi
      - name: Configure portable toolchain (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RELEASE_TARGET" == "linux-x86" ]]; then
            extra+=("-DCMAKE_CXX_FLAGS=-m32" "-DCMAKE_EXE_LINKER_FLAGS=-m32" "-DCMAKE_SHARED_LINKER_FLAGS=-m32")
          fi
          cmake -S . -B build -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON \
            -DNOQERI_ENABLE_SDL2=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release \
            "-DNOQERI_PACKAGE_TARGET=$RELEASE_TARGET" "${extra[@]}"
      - name: Configure portable toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = 'x64'
          $generator = 'Visual Studio 17 2022'
          if ($env:RELEASE_TARGET -eq 'windows-x86') { $architecture = 'Win32' }
          if ($env:RELEASE_TARGET -eq 'windows-aarch64') {
            $architecture = 'ARM64'
            $generator = 'Visual Studio 18 2026'
          }
          cmake -S . -B build -G $generator -A $architecture `
            -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF `
            -DBUILD_TESTING=ON "-DNOQERI_PACKAGE_TARGET=$env:RELEASE_TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build toolchain and portability test
        run: cmake --build build --config Release --target noqeri noqeri-nqri noqeri_graphics_fastpath noqeri-graphics-portability-test --parallel 2
      - name: Portable graphics and shader tests
        run: ctest --test-dir build -C Release --output-on-failure -R '^noqeri-graphics-'
      - name: Install SDK
        run: cmake --install build --config Release --prefix stage
      - name: Validate installed SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./stage/bin/noqeri --version
          ./stage/bin/noqeri check examples/hello.noqeri
          ./stage/bin/noqeri-nqri --selftest
          test -s stage/share/noqeri/Lib/std/render2d.noqeri
          test -d stage/include/noqeri
          case "$RELEASE_TARGET" in
            linux-x86) file stage/bin/noqeri | grep -F 'ELF 32-bit' ;;
            linux-x86_64|linux-aarch64) file stage/bin/noqeri | grep -F 'ELF 64-bit' ;;
            macos-*) file stage/bin/noqeri | grep -F 'Mach-O 64-bit' ;;
          esac
      - name: Validate installed SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./stage/bin/noqeri.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./stage/bin/noqeri.exe check examples/hello.noqeri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./stage/bin/noqeri-nqri.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path stage/share/noqeri/Lib/std/render2d.noqeri)) { throw "Standard library missing" }
          if (!(Test-Path stage/include/noqeri)) { throw "Public headers missing" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'stage/bin/noqeri.exe'))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = switch ($env:RELEASE_TARGET) {
            'windows-x86' { 0x14c }
            'windows-x86_64' { 0x8664 }
            'windows-aarch64' { 0xaa64 }
          }
          if ($machine -ne $expected) { throw "Incorrect Windows PE machine type: $machine (expected $expected)" }
      - name: Export portable archives and native executables
        shell: bash
        run: bash scripts/distribution/archive-sdk.sh
      - name: Generate Linux DEB / RPM installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G DEB -B artifacts
          cpack --config build/CPackConfig.cmake -G RPM -B artifacts
          for pkg in artifacts/*.deb; do dpkg-deb --info "$pkg"; done
          for pkg in artifacts/*.rpm; do rpm -qpi "$pkg"; done
      - name: Generate macOS native PKG installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G productbuild -B artifacts
          for pkg in artifacts/*.pkg; do
            pkgutil --expand "$pkg" package-expanded
            test -f package-expanded/Distribution
            rm -rf package-expanded
          done
      - name: Generate Windows native NSIS setup and MSI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(noqeri VERSION ([0-9.]+)')
          if (!$match.Success) { throw 'Noqeri project version not found' }
          $base = "noqeri-$($match.Groups[1].Value)-$($env:RELEASE_TARGET)"
          cpack --config build/CPackConfig.cmake -G NSIS -B artifacts -D "CPACK_PACKAGE_FILE_NAME=$base-setup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "artifacts/$base-setup.exe")) { throw 'NSIS setup installer missing' }
          if ($env:RELEASE_TARGET -ne 'windows-aarch64') {
            cpack --config build/CPackConfig.cmake -G WIX -B artifacts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path "artifacts/$base.msi")) { throw 'MSI installer missing' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Android NDK / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, target: android-aarch64, elf_machine: AArch64}
          - {abi: x86_64, target: android-x86_64, elf_machine: X86-64}
    env:
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      ANDROID_ABI: ${{ matrix.abi }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        shell: bash
        run: sdkmanager --install "ndk;${NDK_VERSION}"
      - name: Configure Android CLI toolchain (API 24+)
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -f "${ndk}/build/cmake/android.toolchain.cmake"
          cmake -S . -B build-android -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=${ndk}/build/cmake/android.toolchain.cmake" \
            "-DANDROID_ABI=${ANDROID_ABI}" -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF \
            -DBUILD_TESTING=OFF
      - name: Cross-compile Android SDK
        run: cmake --build build-android --target noqeri noqeri-nqri noqeri_graphics_fastpath --parallel 2
      - name: Install Android SDK
        run: cmake --install build-android --prefix stage
      - name: Verify Android binaries and SDK files
        shell: bash
        run: |
          set -euo pipefail
          readelf -h stage/bin/noqeri | grep -F "${ELF_MACHINE}"
          readelf -h stage/bin/noqeri-nqri | grep -F "${ELF_MACHINE}"
          readelf -l stage/bin/noqeri | grep -F '/system/bin/linker64'
          test -s stage/share/noqeri/Lib/std/render2d.noqeri
          test -d stage/include/noqeri
          # Cross-built Android executables are not runnable on the Linux host.
          # Device/emulator execution remains a separate qualification gate.
      - name: Archive Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ref=${RELEASE_REF//[^a-zA-Z0-9_.-]/-}
          mkdir -p artifacts
          cmake -E tar czf "artifacts/noqeri-${ref}-${RELEASE_TARGET}.tar.gz" -- stage
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD VM / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, target: freebsd-x86_64}
          - {arch: aarch64, target: freebsd-aarch64}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: ${{ matrix.arch }}
          envs: RELEASE_TARGET
          prepare: |
            pkg install -y cmake
          run: |
            set -eu
            cmake -S . -B build-freebsd -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build build-freebsd --target noqeri noqeri-nqri noqeri_graphics_fastpath --parallel 2
            cmake --install build-freebsd --prefix stage
            ./stage/bin/noqeri --version
            ./stage/bin/noqeri check examples/hello.noqeri
            ./stage/bin/noqeri-nqri --selftest
            test -s stage/share/noqeri/Lib/std/render2d.noqeri
            test -d stage/include/noqeri
            ref=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
            mkdir -p artifacts
            tar -czf "artifacts/noqeri-${ref}-${RELEASE_TARGET}.tar.gz" stage
            rm -rf build-freebsd stage
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  openbsd:
    name: OpenBSD VM / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, target: openbsd-x86_64}
          - {arch: aarch64, target: openbsd-aarch64}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and package in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          arch: ${{ matrix.arch }}
          envs: RELEASE_TARGET
          prepare: |
            pkg_add -I cmake
          run: |
            set -eu
            cmake -S . -B build-openbsd -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_ENABLE_SDL2=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build build-openbsd --target noqeri noqeri-nqri noqeri_graphics_fastpath --parallel 2
            cmake --install build-openbsd --prefix stage
            ./stage/bin/noqeri --version
            ./stage/bin/noqeri check examples/hello.noqeri
            ./stage/bin/noqeri-nqri --selftest
            test -s stage/share/noqeri/Lib/std/render2d.noqeri
            test -d stage/include/noqeri
            ref=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
            mkdir -p artifacts
            tar -czf "artifacts/noqeri-${ref}-${RELEASE_TARGET}.tar.gz" stage
            rm -rf build-openbsd stage
      - uses: actions/upload-artifact@v4
        with:
          name: noqeri-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish verified archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, android, freebsd, openbsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check archive coverage and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for target in linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64 macos-x86_64 macos-aarch64 android-aarch64 android-x86_64 freebsd-x86_64 freebsd-aarch64 openbsd-x86_64 openbsd-aarch64; do
            archives=(noqeri-*-"$target".tar.gz noqeri-*-"$target".zip)
            found=0
            for archive in "${archives[@]}"; do
              if [[ -f "$archive" && -s "$archive" ]]; then found=$((found + 1)); fi
            done
            if [[ "$found" -ne 1 ]]; then echo "Expected one archive for $target, found $found" >&2; exit 1; fi
          done
          sha256sum noqeri-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
