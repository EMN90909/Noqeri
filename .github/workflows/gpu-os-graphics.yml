name: Noqeri GPU shaders and OS framebuffer
concurrency:
  group: noqeri-graphics-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'Compiler/shader_backend.cpp'
      - 'Include/noqeri/shader_backend.hpp'
      - 'Compiler/bootstrap/cli_host.cpp'
      - 'CMakeLists.txt'
      - 'Lib/std/render2d.noqeri'
      - 'Lib/std/render3d.noqeri'
      - 'Lib/std/os_framebuffer.noqeri'
      - 'tests/cpp/os_framebuffer_differential.cpp'
      - 'Lib/std/gpu_firmware.noqeri'
      - 'tests/scripts/gpu-firmware-sim-e2e.sh'
      - 'tests/cpp/gpu_firmware_sim_test.cpp'
      - 'tests/cpp/gpu_firmware_sim_app.cpp'
      - 'examples/gpu_firmware_sim.noqeri'
      - 'tests/fixtures/render3d_baseline.txt'
      - 'tests/scripts/render3d-ab-summary.mjs'
      - 'scripts/gpu-firmware-package.mjs'
      - 'tests/gpu-firmware-package.test.mjs'
      - 'Doc/GPU_FIRMWARE_DEVELOPMENT.md'
      - 'examples/render3d_demo.noqeri'
      - 'tests/shader-vertex3d.test.mjs'
      - 'examples/shaders/webgpu3d_demo.html'
      - 'tests/cpp/render3d_headless_demo.cpp'
      - 'examples/os_framebuffer_demo.noqeri'
      - 'tests/cpp/os_framebuffer_headless_test.cpp'
      - 'examples/graphics_demo.noqeri'
      - 'examples/shaders/**'
      - 'Runtime/native/os_renderer_sdl.cpp'
      - 'tests/cpp/os_renderer_viewport_test.cpp'
      - 'Include/noqeri/os_renderer_sdl.h'
      - 'tests/cpp/graphics_headless_test.cpp'
      - 'tests/scripts/graphics-native-e2e.sh'
      - 'tests/scripts/render3d-native-e2e.sh'
      - 'tests/scripts/render3d-performance-summary.mjs'
      - 'Doc/RENDER3D_QUALIFICATION.md'
      - 'tests/cpp/render3d_differential.cpp'
      - 'tests/scripts/graphics-raster-perf.sh'
      - 'tests/scripts/graphics-performance-summary.mjs'
      - 'tests/cpp/graphics_full_frame_differential.cpp'
      - 'tests/shader-compiler.test.mjs'
      - 'tests/shader-v2.test.mjs'
      - 'tests/shader-v3.test.mjs'
      - 'tests/shader-stage2-gate.test.mjs'
      - 'scripts/qualify-shader-stage2.mjs'
      - 'Doc/GPU_SHADER_V3.md'
      - 'examples/shaders/physical_qualification.*'
      - 'tests/webgpu-host.test.mjs'
      - 'tests/wgsl-validator/**'
      - '.github/workflows/gpu-os-graphics.yml'
  push:
    paths:
      - 'Compiler/shader_backend.cpp'
      - 'Include/noqeri/shader_backend.hpp'
      - 'Compiler/bootstrap/cli_host.cpp'
      - 'CMakeLists.txt'
      - 'Lib/std/render2d.noqeri'
      - 'Lib/std/render3d.noqeri'
      - 'Lib/std/os_framebuffer.noqeri'
      - 'tests/cpp/os_framebuffer_differential.cpp'
      - 'Lib/std/gpu_firmware.noqeri'
      - 'tests/scripts/gpu-firmware-sim-e2e.sh'
      - 'tests/cpp/gpu_firmware_sim_test.cpp'
      - 'tests/cpp/gpu_firmware_sim_app.cpp'
      - 'examples/gpu_firmware_sim.noqeri'
      - 'tests/fixtures/render3d_baseline.txt'
      - 'tests/scripts/render3d-ab-summary.mjs'
      - 'scripts/gpu-firmware-package.mjs'
      - 'tests/gpu-firmware-package.test.mjs'
      - 'Doc/GPU_FIRMWARE_DEVELOPMENT.md'
      - 'examples/render3d_demo.noqeri'
      - 'tests/shader-vertex3d.test.mjs'
      - 'examples/shaders/webgpu3d_demo.html'
      - 'tests/cpp/render3d_headless_demo.cpp'
      - 'examples/graphics_demo.noqeri'
      - 'examples/shaders/**'
      - 'Runtime/native/os_renderer_sdl.cpp'
      - 'tests/cpp/os_renderer_viewport_test.cpp'
      - 'tests/**/graphics*'
      - 'tests/scripts/graphics-raster-perf.sh'
      - 'tests/scripts/graphics-performance-summary.mjs'
      - 'tests/shader-compiler.test.mjs'
      - 'tests/shader-v2.test.mjs'
      - 'tests/shader-v3.test.mjs'
      - 'tests/shader-stage2-gate.test.mjs'
      - 'scripts/qualify-shader-stage2.mjs'
      - 'Doc/GPU_SHADER_V3.md'
      - 'examples/shaders/physical_qualification.*'
      - 'tests/webgpu-host.test.mjs'
      - 'Doc/GPU_SHADER_V2.md'
      - 'tests/wgsl-validator/**'
      - '.github/workflows/gpu-os-graphics.yml'
jobs:
  graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 headers and native rendering backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config
      - name: Build Noqeri shader/compiler frontend
        run: |
          cmake -S . -B /tmp/noqeri-graphics-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNOQERI_WARNINGS_AS_ERRORS=ON
          cmake --build /tmp/noqeri-graphics-build --target noqeri noqeri_os_renderer_sdl -j 2
      - name: Check typed shader source and reject unsafe GPU programs
        run: NOQERI_COMPILER=/tmp/noqeri-graphics-build/noqeri node --test tests/shader-compiler.test.mjs tests/shader-v2.test.mjs tests/shader-v3.test.mjs tests/shader-vertex3d.test.mjs tests/shader-stage2-gate.test.mjs tests/webgpu-host.test.mjs tests/gpu-firmware-package.test.mjs
      - name: Verify WebGPU browser host is valid JavaScript
        run: |
          node --check examples/shaders/webgpu_host.mjs
          node --check examples/shaders/physical_qualification.mjs
          node --check scripts/qualify-shader-stage2.mjs
      - name: Naga syntax and semantic validation of both generated GPU stages
        run: |
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/color_gradient.noqeri /tmp/noqeri-fragment.wgsl --stage=fragment
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/invert_compute.noqeri /tmp/noqeri-compute.wgsl --stage=compute
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/float_compute.noqeri /tmp/noqeri-float-compute.wgsl --stage=compute --workgroup-size=128
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/posterize_fragment.noqeri /tmp/noqeri-posterize.wgsl --stage=fragment
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/grayscale_fragment.noqeri /tmp/noqeri-grayscale.wgsl --stage=fragment
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/vector_fragment.noqeri /tmp/noqeri-vector-fragment.wgsl --stage=fragment
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/vector_lighting_fragment.noqeri /tmp/noqeri-vector-lighting-fragment.wgsl --stage=fragment
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/texture_fragment.noqeri /tmp/noqeri-texture-fragment.wgsl --stage=fragment
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/vector_compute.noqeri /tmp/noqeri-vector-compute.wgsl --stage=compute
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/vertex3d.noqeri /tmp/noqeri-vertex3d.wgsl --stage=vertex
          /tmp/noqeri-graphics-build/noqeri shader examples/shaders/fragment3d.noqeri /tmp/noqeri-fragment3d.wgsl --stage=fragment
          cargo run --quiet --manifest-path tests/wgsl-validator/Cargo.toml -- /tmp/noqeri-vertex3d.wgsl /tmp/noqeri-fragment3d.wgsl /tmp/noqeri-vector-fragment.wgsl /tmp/noqeri-vector-lighting-fragment.wgsl /tmp/noqeri-texture-fragment.wgsl /tmp/noqeri-vector-compute.wgsl /tmp/noqeri-fragment.wgsl /tmp/noqeri-compute.wgsl /tmp/noqeri-float-compute.wgsl /tmp/noqeri-posterize.wgsl /tmp/noqeri-grayscale.wgsl
      - name: Build real Noqeri framebuffer and run headless plus SDL2 dummy OS presenter
        env:
          GRAPHICS_EVIDENCE_DIR: /tmp/noqeri-graphics-evidence
        run: |
          NOQERI_REQUIRE_SDL2=1 timeout 150s bash tests/scripts/graphics-native-e2e.sh /tmp/noqeri-graphics-build/noqeri
      - name: Verify GPU firmware development MMIO simulator and package tool
        run: |
          timeout 90s bash tests/scripts/gpu-firmware-sim-e2e.sh /tmp/noqeri-graphics-build/noqeri
          node --check scripts/gpu-firmware-package.mjs
      - name: Verify and benchmark 3D triangle depth and bounded projection
        env:
          GRAPHICS_EVIDENCE_DIR: /tmp/noqeri-graphics-evidence
        run: timeout 150s bash tests/scripts/render3d-native-e2e.sh /tmp/noqeri-graphics-build/noqeri
      - name: Validate every pixel and record native CPU raster A/B timings
        env:
          GRAPHICS_EVIDENCE_DIR: /tmp/noqeri-graphics-evidence
        run: timeout 180s bash tests/scripts/graphics-raster-perf.sh /tmp/noqeri-graphics-build/noqeri
      - name: Archive native CPU raster results and assembly (not GPU timing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noqeri-cpu-raster-evidence
          if-no-files-found: warn
          path: /tmp/noqeri-graphics-evidence/
          retention-days: 14
