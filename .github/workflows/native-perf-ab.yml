name: Native AOT performance A/B
on:
  pull_request:
    branches: [main]
    paths:
      - 'Compiler/native_backend.cpp'
      - 'Compiler/register_alloc.cpp'
      - 'Compiler/optimizer.cpp'
      - 'scripts/native-build.mjs'
      - 'scripts/native-perf-evidence.py'
      - 'tests/native_perf_evidence_test.py'
      - '.github/workflows/native-perf-ab.yml'
permissions:
  contents: read
jobs:
  same-runner-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout original base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Checkout proposed compiler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Build Stage-0 compilers with identical C++ settings
        shell: bash
        run: |
          set -euo pipefail
          for revision in baseline candidate; do
            cmake -S "$revision" -B "$revision/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build "$revision/build" --target noqeri --parallel 2
          done
      - name: Prepare identical long-running sort workload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for revision in ("baseline", "candidate"):
              source = Path(revision) / "Benchmarks/workloads/sorting.noqeri"
              text = source.read_text()
              original = "while round < 200 as usize"
              assert text.count(original) == 1, "expected pinned input workload"
              (source.parent / "sorting_ab.noqeri").write_text(text.replace(original, "while round < 20000 as usize"))
          PY
      - name: Build standalone native ELF for both revisions
        shell: bash
        run: |
          set -euo pipefail
          for revision in baseline candidate; do
            (
              cd "$revision"
              node scripts/native-build.mjs Benchmarks/workloads/sorting_ab.noqeri build/aot-ab-sorting --compiler=build/noqeri --opt=-O3
              ./build/noqeri build Benchmarks/workloads/sorting_ab.noqeri build/aot-ab-sorting.s -O3
            )
          done
      - name: Validate outputs and compare runtime on one runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform, statistics, subprocess, time
          paths = {revision: Path(revision) / "build/aot-ab-sorting" for revision in ("baseline", "candidate")}
          samples = {revision: [] for revision in paths}
          expected = b"64\n65032\n"
          def execute(revision):
              start = time.perf_counter_ns()
              result = subprocess.run([str(paths[revision].resolve())], capture_output=True, check=True)
              duration = (time.perf_counter_ns() - start) / 1e6
              if result.stdout != expected:
                  raise AssertionError(f"{revision} unexpected stdout: {result.stdout!r}")
              return duration
          for _ in range(3):
              for revision in paths:
                  execute(revision)
          for i in range(25):
              for revision in (("baseline", "candidate") if i % 2 == 0 else ("candidate", "baseline")):
                  samples[revision].append(execute(revision))
          result = {
              "schema": 1, "cpu": platform.processor(), "machine": platform.machine(),
              "kernel": platform.release(), "workload": "sorting_ab.noqeri (20000 rounds)",
              "optimizer": "-O3", "warmups_per_binary": 3,
              "samples": samples,
              "median_ms": {k: statistics.median(v) for k,v in samples.items()},
              "assembly_stack_mov_lines": {k: sum("mov" in line and "[rbp-" in line for line in
                  (Path(k) / "build/aot-ab-sorting.s").read_text().splitlines()) for k in paths},
              "sha256": {k: hashlib.sha256(path.read_bytes()).hexdigest() for k,path in paths.items()},
          }
          result["speedup"] = result["median_ms"]["baseline"] / result["median_ms"]["candidate"]
          print(json.dumps(result, indent=2))
          Path("candidate/build/native-perf-ab.json").write_text(json.dumps(result, indent=2)+"\n")
          if result["speedup"] < 0.80:
              raise SystemExit("Performance regression exceeds 20% on this runner.")
          PY
      - name: Compare compiler Stage-0 code-generation latency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, statistics, subprocess, time
          from pathlib import Path
          report_path=Path("candidate/build/native-perf-ab.json")
          data=json.loads(report_path.read_text())
          samples={"baseline":[],"candidate":[]}
          def compile_once(revision):
              exe=Path(revision).resolve()/"build/noqeri"
              source=Path(revision).resolve()/"Benchmarks/workloads/sorting_ab.noqeri"
              output=Path(revision).resolve()/"build/compiler-latency.s"
              start=time.perf_counter_ns()
              subprocess.run([str(exe),"build",str(source),str(output),"-O3"],
                             check=True,capture_output=True)
              return (time.perf_counter_ns()-start)/1e6
          for _ in range(2):
              for name in samples:compile_once(name)
          for turn in range(15):
              for name in (("baseline","candidate") if turn%2==0 else ("candidate","baseline")):
                  samples[name].append(compile_once(name))
          data["stage0_compile_median_ms"]={k:statistics.median(v) for k,v in samples.items()}
          data["stage0_compile_samples_ms"]=samples
          data["emitted_label_lines"]={
              k:sum(line.startswith(".L_") and line.endswith(":")
                    for line in (Path(k)/"build/compiler-latency.s").read_text().splitlines())
              for k in samples
          }
          report_path.write_text(json.dumps(data,indent=2)+"\n")
          print("Native compiler A/B:",json.dumps({
              "median_ms":data["stage0_compile_median_ms"],
              "assembly_label_lines":data["emitted_label_lines"]},indent=2))
          PY
      - name: Measure dependent constant-remainder optimization
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/Benchmarks/workloads/modulo_ab.noqeri baseline/Benchmarks/workloads/modulo_ab.noqeri
          for revision in baseline candidate; do
            (
              cd "$revision"
              node scripts/native-build.mjs Benchmarks/workloads/modulo_ab.noqeri build/modulo-ab --compiler=build/noqeri --opt=-O3
            )
          done
          python3 - <<'PY'
          import json, statistics, subprocess, time
          from pathlib import Path
          report=Path("candidate/build/native-perf-ab.json")
          data=json.loads(report.read_text())
          paths={x:(Path(x)/"build/modulo-ab").resolve() for x in ("baseline","candidate")}
          samples={k:[] for k in paths}
          expected=subprocess.run([str(paths["baseline"])],capture_output=True,check=True).stdout
          def run(name):
              start=time.perf_counter_ns()
              actual=subprocess.run([str(paths[name])],capture_output=True,check=True).stdout
              if actual!=expected:raise AssertionError(f"dependent modulo output mismatch for {name}: {actual!r} != {expected!r}")
              return (time.perf_counter_ns()-start)/1e6
          for _ in range(3):
              for name in paths:run(name)
          for i in range(17):
              for name in (("baseline","candidate") if i%2==0 else ("candidate","baseline")):
                  samples[name].append(run(name))
          median={k:statistics.median(v) for k,v in samples.items()}
          data["dependent_modulo"]={"warmups":3,"samples":samples,"median_ms":median,
                                   "speedup":median["baseline"]/median["candidate"],
                                   "verified_output":expected.decode().strip()}
          report.write_text(json.dumps(data,indent=2)+"\n")
          print("Dependent modulo A/B:",json.dumps(data["dependent_modulo"],indent=2))
          PY
      - name: Compare deterministic reshuffled sorting (not already sorted)
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/Benchmarks/workloads/sorting_reshuffled.noqeri baseline/Benchmarks/workloads/sorting_reshuffled.noqeri
          for revision in baseline candidate; do
            (
              cd "$revision"
              node scripts/native-build.mjs Benchmarks/workloads/sorting_reshuffled.noqeri build/reshuffle-ab --compiler=build/noqeri --opt=-O3
            )
          done
          python3 - <<'PY'
          import json, statistics, subprocess, time
          from pathlib import Path
          report=Path("candidate/build/native-perf-ab.json")
          data=json.loads(report.read_text())
          paths={name:(Path(name)/"build/reshuffle-ab").resolve() for name in ("baseline","candidate")}
          samples={name:[] for name in paths}
          expected=b"13104300\n"
          def run(name):
              begin=time.perf_counter_ns()
              done=subprocess.run([str(paths[name])],capture_output=True,check=True)
              if done.stdout!=expected:
                  raise AssertionError(f"{name} shuffled-sort checksum mismatch {done.stdout!r}")
              return (time.perf_counter_ns()-begin)/1e6
          for _ in range(3):
              for name in paths:run(name)
          for i in range(15):
              for name in (("baseline","candidate") if i%2==0 else ("candidate","baseline")):
                  samples[name].append(run(name))
          med={name:statistics.median(values) for name,values in samples.items()}
          data["reshuffled_sorting"]={"median_ms":med,"samples_ms":samples,
                                     "speedup":med["baseline"]/med["candidate"],
                                     "checksum":int(expected.strip()),"warmups":3}
          report.write_text(json.dumps(data,indent=2)+"\n")
          print("Seeded reshuffled sorting:",json.dumps(data["reshuffled_sorting"],indent=2))
          if med["candidate"]>med["baseline"]*1.2:
              raise SystemExit("Shuffled sorting regressed by more than 20%")
          PY
      - name: Qualify p50/p95, binary size, RSS and optional perf counters
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s candidate/tests -p native_perf_evidence_test.py
          python3 candidate/scripts/native-perf-evidence.py candidate/build/native-perf-ab.json
      - name: Upload raw measurements
        uses: actions/upload-artifact@v4
        with:
          name: noqeri-native-perf-ab
          path: candidate/build/native-perf-ab.json
