name: Local GVN optimizer same-runner A/B
on:
  pull_request:
    branches: [main]
    paths:
      - 'Compiler/optimizer.cpp'
      - 'tests/cpp/optimizer_gvn_perf_test.cpp'
      - 'tests/optimizer_gvn_ab.py'
      - '.github/workflows/optimizer-gvn-ab.yml'
permissions:
  contents: read
jobs:
  optimizer-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Build identical optimizer test against both revisions
        shell: bash
        run: |
          set -euo pipefail
          for revision in baseline candidate; do
            g++ -std=c++17 -O2 -I"$revision/Include/noqeri" \
                -I"$revision/Compiler/bootstrap" \
                candidate/tests/cpp/optimizer_gvn_perf_test.cpp \
                "$revision/Compiler/optimizer.cpp" \
                -o "$revision/optimizer-gvn-bench"
          done
      - name: Validate correctness on both revisions
        run: |
          ./baseline/optimizer-gvn-bench
          ./candidate/optimizer-gvn-bench
      - name: Measure compiler optimizer pass on identical NIR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 candidate/tests/optimizer_gvn_ab.py baseline/optimizer-gvn-bench candidate/optimizer-gvn-bench
      - name: Upload measured A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-gvn-ab
          path: optimizer-gvn-ab.json
