name: Apply Noqeri extension migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extension-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite legacy source and portable-format names
        shell: python
        run: |
          from pathlib import Path

          root = Path(".")
          skip_dirs = {".git", ".github", "build", "node_modules", ".cache"}
          binary_suffixes = {
              ".png",".jpg",".jpeg",".webp",".gif",".ico",".pdf",".zip",".gz",".tar",
              ".woff",".woff2",".ttf",".otf",".exe",".dll",".so",".dylib",".a",".lib"
          }
          replacements = [
              (".nqr", ".noqeri"),
              (".nqo", ".nqri"),
              ("NOQERI_STAGE1_NQO", "NOQERI_STAGE1_NQRI"),
              ("NOQERI_NQO_RUNTIME", "NOQERI_NQRI_RUNTIME"),
              ("nqo_vm", "nqri_vm"),
              ("nqo-vm", "nqri-vm"),
              ("Nqo", "Nqri"),
              ("nqo", "nqri"),
              ("NQO2", "NQRI"),
              ("NQO", "NQRI"),
          ]

          changed = []
          for path in root.rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              # Portable format magic is now the literal four-byte sequence NQRI.
              updated = updated.replace(
                  "bytes[0]!='N'||bytes[1]!='Q'||bytes[2]!='O'||bytes[3]!='2'",
                  "bytes[0]!='N'||bytes[1]!='Q'||bytes[2]!='R'||bytes[3]!='I'"
              )
              updated = updated.replace(
                  "b[0]='N';b[1]='Q';b[2]='O';b[3]='2'",
                  "b[0]='N';b[1]='Q';b[2]='R';b[3]='I'"
              )
              updated = updated.replace(
                  "return 79 as u8", "return 82 as u8"
              ).replace(
                  "return 50 as u8", "return 73 as u8"
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed.append(path.as_posix())
          print(f"updated {len(changed)} files")
          for path in changed:
              print(path)
      - name: Verify no legacy extensions remain in tracked text
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '\.nqr([^i]|$)|\.nqo([^a-zA-Z]|$)' -- ':!*.png' ':!*.webp' ':!*.jpg' ':!*.jpeg'; then
            echo "legacy extension references remain" >&2
            exit 1
          fi
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(language): complete .noqeri and .nqri migration"
          git push origin HEAD:main
