name: Noqeri AI physical GPU training qualification
# Only trusted, explicitly requested runs use the self-hosted GPU runner.
# This workflow does not treat a CPU-only OpenCL ICD as GPU verification.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noqeri-physical-gpu
  cancel-in-progress: false
jobs:
  physical-gpu:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, noqeri-gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prove physical device, compare GPU gradients and train model
        shell: bash
        run: bash scripts/ai-gpu-verify.sh gpu-evidence
      - name: Retain hardware, driver and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noqeri-physical-gpu-qualification
          path: gpu-evidence/
          if-no-files-found: warn
          retention-days: 30
