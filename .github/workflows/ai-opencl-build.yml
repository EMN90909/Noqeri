name: Noqeri optional OpenCL accelerator build
on:
  push:
    branches: [main]
    paths:
      - 'Runtime/native/ai_gpu_opencl.cpp'
      - 'tests/cpp/ai_gpu_hardware_test.cpp'
      - 'scripts/ai-gpu-verify.sh'
      - 'Runtime/native/ai_framework_tensor.cpp'
      - 'Include/noqeri/ai_framework.hpp'
      - 'CMakeLists.txt'
      - '.github/workflows/ai-opencl-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Runtime/native/ai_gpu_opencl.cpp'
      - 'tests/cpp/ai_gpu_hardware_test.cpp'
      - 'scripts/ai-gpu-verify.sh'
      - 'Runtime/native/ai_framework_tensor.cpp'
      - 'Include/noqeri/ai_framework.hpp'
      - 'CMakeLists.txt'
      - '.github/workflows/ai-opencl-build.yml'
permissions:
  contents: read
jobs:
  opencl-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL headers and loader (not a physical GPU)
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
      - name: Compile the actual GPU-only accelerator source
        run: |
          set -euo pipefail
          cmake -S . -B build-opencl -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNOQERI_AI_OPENCL=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_WEB_SQL_DRIVERS=OFF
          grep -F -- '-DNQAI_HAVE_OPENCL=1' build-opencl/compile_commands.json
          cmake --build build-opencl --target noqeri-ai-resume-depth-test noqeri-ai-gpu-hardware-test --parallel 2
      - name: Check CPU-only framework tests with real OpenCL SDK
        run: ctest --test-dir build-opencl --output-on-failure -R '^noqeri-ai-resume-depth

      - name: Prove hardware-only test refuses a normal CPU hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if ./build-opencl/noqeri-ai-gpu-hardware-test build-opencl/fake-gpu-pass.json > build-opencl/no-gpu.log 2>&1; then
            cat build-opencl/no-gpu.log
            echo 'ERROR: GPU hardware regression passed without a physical GPU'
            exit 1
          fi
          cat build-opencl/no-gpu.log
          grep -F 'no CL_DEVICE_TYPE_GPU present' build-opencl/no-gpu.log
          test ! -e build-opencl/fake-gpu-pass.json
