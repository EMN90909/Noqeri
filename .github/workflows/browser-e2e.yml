name: Browser E2E native web security smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'Compiler/bootstrap/web_native*'
      - 'tests/browser_e2e.mjs'
      - 'tests/browser_reactive_e2e.mjs'
      - 'tests/browser_view_e2e.mjs'
      - 'tests/browser_native_client_e2e.mjs'
      - 'tests/browser_native_client_async_e2e.mjs'
      - 'examples/native_web_client/**'
      - 'examples/native_web_motion/**'
      - 'tests/browser_native_motion_e2e.mjs'
      - 'Runtime/web-view-compiler.mjs'
      - 'Runtime/web-view-project.mjs'
      - 'Runtime/noqeri-web-runtime.mjs'
      - 'examples/native_web_actions/**'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'Compiler/bootstrap/web_native*'
      - 'tests/browser_e2e.mjs'
      - 'tests/browser_reactive_e2e.mjs'
      - 'tests/browser_view_e2e.mjs'
      - 'tests/browser_native_client_e2e.mjs'
      - 'tests/browser_native_client_async_e2e.mjs'
      - 'examples/native_web_client/**'
      - 'examples/native_web_motion/**'
      - 'tests/browser_native_motion_e2e.mjs'
      - 'Runtime/web-view-compiler.mjs'
      - 'Runtime/web-view-project.mjs'
      - 'Runtime/noqeri-web-runtime.mjs'
      - 'examples/native_web_actions/**'
      - '.github/workflows/browser-e2e.yml'
permissions:
  contents: read
jobs:
  chromium-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser runtime
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build native web tool (not a browser JS runtime)
        run: |
          cmake -S . -B build-browser -DCMAKE_BUILD_TYPE=Release -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON -DNOQERI_WEB_SQL_DRIVERS=OFF
          cmake --build build-browser --target noqeri-web --parallel 2
      - name: Run actual Chromium end-to-end session, hydration and navigation performance
        env:
          NOQERI_BROWSER_NAV_P95_MS: '800'
        run: |
          node tests/browser_e2e.mjs ./build-browser/noqeri-web ./examples/native_web_actions
          node tests/browser_reactive_e2e.mjs ./build-browser/noqeri-web ./examples/native_web_actions
          node tests/browser_view_e2e.mjs ./examples/native_web
          node tests/browser_native_client_e2e.mjs ./build-browser/noqeri-web ./examples/native_web_client
          node tests/browser_native_client_async_e2e.mjs ./build-browser/noqeri-web
          node tests/browser_native_motion_e2e.mjs ./build-browser/noqeri-web
