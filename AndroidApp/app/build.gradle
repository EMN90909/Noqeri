plugins {
    id 'com.android.application'
}

android {
    namespace 'org.noqeri.mobile'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.noqeri.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.3'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DNOQERI_GRAPHICS_PORTABLE_BUILD=ON',
                          '-DNOQERI_ENABLE_SDL2=OFF',
                          '-DNOQERI_BUILD_ANDROID_APP=ON',
                          '-DBUILD_TESTING=OFF',
                          '-DANDROID_STL=c++_static'
                targets 'noqeri_android'
                cppFlags '-std=c++17'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
