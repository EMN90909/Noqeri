<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Noqeri physical GPU qualification</title>
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
<h1>Noqeri WebGPU hardware qualification</h1>
<p>Generate shaders in build/ and serve the repository root using localhost or HTTPS. A successful result only qualifies the tested browser, GPU and driver combination.</p>
<button id="start" type="button">Run actual GPU tests</button>
<canvas id="output" width="2" height="2" style="width:256px;height:256px;image-rendering:pixelated" aria-label="GPU texture output"></canvas>
<pre id="result" role="status" aria-live="polite"></pre>
<script type="module">
import {qualifyPhysicalGpu} from './physical_qualification.mjs'
document.querySelector('#start').addEventListener('click',async()=>{
  const out=document.querySelector('#result')
  out.textContent='Running GPU qualification...'
  try {out.textContent=JSON.stringify(await qualifyPhysicalGpu(
    document.querySelector('#output')),null,2)}
  catch(error){out.textContent='FAIL: '+String(error.stack||error)}
})
</script>
</body></html>
